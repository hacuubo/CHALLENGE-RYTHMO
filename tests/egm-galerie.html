<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerie EGM</title><link rel="stylesheet" href="../css/styles.css">
<style>h3{margin:18px 0 6px}</style></head>
<body><main id="g" style="max-width:1100px"><h1>Galerie des presets EGM</h1></main>
<script type="module">
import { dessinerEGM, PRESETS_EGM } from '../js/egm.js';
const g = document.getElementById('g');
for (const p of PRESETS_EGM) {
  const h = document.createElement('h3'); h.textContent = p; g.append(h);
  const d = document.createElement('div'); d.className = 'ecg-cadre'; const c = document.createElement('canvas'); d.append(c); g.append(d);
  dessinerEGM(c, { preset: p }, 'galerie');
}
</script></body></html>
